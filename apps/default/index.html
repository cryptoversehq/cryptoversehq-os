    <!-- Suppress MetaMask browser extension connection errors -->
    <script>
      (function() {
        var MM = 'MetaMask';
        window.addEventListener('error', function(e) {
          var msg = String(e.message || e.error && e.error.message || '');
          if (msg.indexOf(MM) !== -1) { e.preventDefault(); e.stopImmediatePropagation(); return false; }
        }, { capture: true });
        window.addEventListener('unhandledrejection', function(e) {
          var msg = '';
          try { msg = String(e.reason && e.reason.message || e.reason || ''); } catch(_) {}
          if (msg.indexOf(MM) !== -1 || msg.indexOf('Failed to connect') !== -1) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
          }
        }, { capture: true });
      })();
    </script>
