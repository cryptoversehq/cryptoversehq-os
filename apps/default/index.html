        window.addEventListener('unhandledrejection', function(e) {
          var msg = '';
          try { msg = String(e.reason && e.reason.message || e.reason || ''); } catch(_) {}
          if (msg.indexOf(MM) !== -1 || msg.indexOf('Failed to connect') !== -1) {

            e.stopPropagation();
            e.stopImmediatePropagation();
          }
        }, { capture: true });
      })();
    </script>
